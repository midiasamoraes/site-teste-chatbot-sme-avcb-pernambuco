<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Analytics — Chatbot AVCB — Sá Moraes Engenharia</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/analytics.css">
  <!-- Shared utilities -->
  <script src="utils/supabaseClient.js"></script>
  <script src="utils/escape.js"></script>
  <script src="utils/format.js"></script>
  <script src="utils/chartHelpers.js"></script>
  <script src="config/constants.js"></script>
</head>
<body>
  <div id="loadingNote">Carregando dados...</div>
  <div id="errorNote" style="display: none; color: red;"></div>
  
  <div id="dashboard" style="display: none;">
    <div id="filtersRow">
      <input type="date" id="filterFrom" placeholder="Data inicial">
      <input type="date" id="filterTo" placeholder="Data final">
      <select id="filterStatus">
        <option value="all">Todos</option>
        <option value="completed">Concluídas</option>
        <option value="incomplete">Não concluídas</option>
      </select>
      <button id="applyFiltersBtn">Aplicar filtros</button>
      <button id="clearFiltersBtn">Limpar filtros</button>
    </div>
    
    <div class="kpis">
      <div class="kpi-card">
        <div class="kpi" id="kpiTotal">0</div>
        <div class="kpi-sub" id="kpiTotalSub">Total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi" id="kpiCompleted">0</div>
        <div class="kpi-sub" id="kpiCompletedSub">Concluídas</div>
      </div>
      <div class="kpi-card">
        <div class="kpi" id="kpiIncomplete">0</div>
        <div class="kpi-sub" id="kpiIncompleteSub">Não concluídas</div>
      </div>
      <div class="kpi-card">
        <div class="kpi" id="kpiRate">0%</div>
        <div class="kpi-sub" id="kpiRateSub">Taxa de conclusão</div>
      </div>
      <div class="kpi-card">
        <div class="kpi" id="kpiAvgTime">0s</div>
        <div class="kpi-sub" id="kpiAvgTimeSub">Tempo médio</div>
      </div>
    </div>
    
    <div class="charts-row">
      <div class="card">
        <h3>Conversas por dia</h3>
        <canvas id="chartTimeline"></canvas>
      </div>
      <div class="card">
        <h3>Where conversations stall</h3>
        <canvas id="chartFunnel"></canvas>
      </div>
      <div class="card">
        <h3>Risk distribution</h3>
        <canvas id="chartRisk"></canvas>
      </div>
      <div class="card">
        <h3>Establishment types</h3>
        <canvas id="chartEstabType"></canvas>
      </div>
    </div>
    
    <div class="charts-row">
      <div class="card">
        <h3>Device types</h3>
        <canvas id="chartDevice"></canvas>
      </div>
      <div class="card">
        <h3>Browsers</h3>
        <canvas id="chartBrowser"></canvas>
      </div>
      <div class="card">
        <h3>Language</h3>
        <div id="languageTable"></div>
      </div>
    </div>
    
    <div class="card full-width">
      <h3>Top estabelecimentos</h3>
      <div id="topEstabTable"></div>
    </div>
    
    <div class="card full-width">
      <h3>Engajamento pós-questionário</h3>
      <div id="engagementTable"></div>
    </div>
    
    <div id="downloadModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
      <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px;">
        <h3>Download dados</h3>
        <button id="downloadRawBtn">Download dados brutos (CSV)</button>
        <button id="downloadReportBtn">Download relatório (HTML)</button>
        <button id="downloadModalClose">Fechar</button>
      </div>
    </div>
  </div>
  
  <button id="refreshBtn" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">Atualizar dados</button>
  <button id="downloadBtn" style="position: fixed; top: 20px; right: 80px; z-index: 1000;">Download</button>
  <script src="js/analytics.js"></script>
</body>
</html>
